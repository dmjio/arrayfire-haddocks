name: Deploy Haddocks

on:
  schedule:
    - cron: '0 3 * * *'  # daily at 3am UTC
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout arrayfire-haskell
        uses: actions/checkout@v4
        with:
          repository: arrayfire/arrayfire-haskell
          ref: master

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable

      - name: Build Haddock docs
        run: nix develop -c sh -c 'cabal update && cabal haddock-project --haddock-hyperlink-source'

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./haddocks
