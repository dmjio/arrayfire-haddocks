name: Deploy Haddocks

on:
  push:
    branches: master
  pull_request:
  schedule:
    - cron: '0 3 * * *'  # daily at 3am UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout arrayfire-haskell
        uses: actions/checkout@v4
        with:
          repository: arrayfire/arrayfire-haskell
          ref: master

      - name: Build haddocks
        run: nix develop -c sh -c 'cabal update && cabal haddock-project'

      - name: Upload haddocks
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./haddocks
